<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Подробнее — KAZAKH</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      color: #fff;
      text-align: center;
      background: url("img/background.jpeg") no-repeat center center/cover;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: brightness(0.75);
    }

    header {
      position: relative;
      text-align: center;
      max-width: 800px;
      padding: 0 20px;
    }

    header h1 {
      font-size: 26px;
      color: #59aaff;
      font-weight: 700;
      margin-bottom: 10px;
    }

    header p {
      font-size: 16px;
      line-height: 1.5;
      color: #f1f1f1;
      max-width: 600px;
      margin: 0 auto;
    }

    .circle-buttons {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 80px;
      padding: 0 10px;
    }

    .circle {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, #000, #59aaff);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: 0.4s ease;
      box-shadow: 0 0 10px rgba(89, 170, 255, 0.6);
      text-align: center;
      font-size: 0.9rem;
      padding: 10px;
    }

    .circle:hover {
      transform: scale(1.1);
      background: linear-gradient(135deg, #59aaff, #000);
      box-shadow: 0 0 20px rgba(89, 170, 255, 0.9);
    }

    /* 📱 Адаптация под телефоны */
    @media (max-width: 600px) {
      header h1 {
        font-size: 20px;
      }

      header p {
        font-size: 14px;
        padding: 0 10px;
      }

      .circle {
        width: 80px;
        height: 80px;
        font-size: 0.8rem;
      }

      .circle-buttons {
        gap: 15px;
        margin-top: 50px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Казахстанские бренды становятся частью новой экономики</h1>
    <p>
      Мы верим, что локальные продукты могут быть не хуже мировых — и даже лучше.
      Наша цель — объединить создателей и покупателей, чтобы поддерживать отечественное
      и развивать креативную индустрию.
    </p>
  </header>

  <div class="circle-buttons">
    <div class="circle">Мода и стиль</div>
    <div class="circle">Технологии</div>
    <div class="circle">Еда</div>
    <div class="circle">Косметика</div>
    <div class="circle">Дом</div>
  </div>
</body>
</html>
