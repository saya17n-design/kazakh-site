<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Подробнее — KAZAKH</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      color: #fff;
      text-align: center;
      background: url("img/background.jpeg") no-repeat center center/cover;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      backdrop-filter: brightness(0.7);
      overflow-x: hidden;
    }

    header {
      margin-top: 80px;
      max-width: 800px;
      padding: 0 20px;
    }

    header h1 {
      font-size: 28px;
      color: #59aaff;
      font-weight: 700;
      margin-bottom: 15px;
    }

    header p {
      font-size: 17px;
      line-height: 1.6;
      color: #f1f1f1;
      max-width: 700px;
      margin: 0 auto;
    }

    /* --- кнопки --- */
    .circle-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 35px;
      margin-top: 70px;
      padding-bottom: 60px;
    }

    .circle-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
    }

    .circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: url("img/button.jpeg") no-repeat center center/cover;
      box-shadow: 0 0 15px rgba(41, 122, 201, 0.6);
      cursor: pointer;
      transition: 0.3s ease;
    }

    .circle:hover {
      transform: scale(1.08);
      box-shadow: 0 0 25px rgba(41, 122, 201, 0.9);
    }

    .circle-label {
      margin-top: 12px;
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
      text-shadow: 0 0 6px rgba(0, 0, 0, 0.5);
    }

    /* --- адаптив --- */
    @media (max-width: 600px) {
      header {
        margin-top: 50px;
      }

      header h1 {
        font-size: 20px;
        line-height: 1.4;
        margin-bottom: 10px;
      }

      header p {
        font-size: 14px;
        padding: 0 10px;
      }

      .circle-buttons {
        gap: 20px;
        margin-top: 40px;
      }

      .circle {
        width: 90px;
        height: 90px;
      }

      .circle-label {
        font-size: 15px;
        margin-top: 8px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Казахстанские бренды становятся частью новой экономики</h1>
    <p>
      Мы верим, что локальные продукты могут быть не хуже мировых — и даже лучше.
      Наша цель — объединить создателей и покупателей, чтобы поддерживать отечественное
      и развивать креативную индустрию.
    </p>
  </header>

  <div class="circle-buttons">
    <a href="fashion.html" class="circle-item">
      <div class="circle"></div>
      <div class="circle-label">Мода</div>
    </a>

    <a href="tech.html" class="circle-item">
      <div class="circle"></div>
      <div class="circle-label">Технологии</div>
    </a>

    <a href="food.html" class="circle-item">
      <div class="circle"></div>
      <div class="circle-label">Еда</div>
    </a>

    <a href="beauty.html" class="circle-item">
      <div class="circle"></div>
      <div class="circle-label">Косметика</div>
    </a>

    <a href="home.html" class="circle-item">
      <div class="circle"></div>
      <div class="circle-label">Дом</div>
    </a>
  </div>
</body>
</html>
